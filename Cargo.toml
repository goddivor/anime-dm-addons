[workspace]
resolver = "2"
members = ["addon-api", "adm-abi", "addons/*/*"]

# Le contrat partagé et la couche ABI vivent ici : l'application Win32 est en C++
# et ne consomme aucun type Rust, elle ne parle que JSON.
[workspace.dependencies]
addon-api = { path = "addon-api" }
adm-abi = { path = "adm-abi" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.27"
regex = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
